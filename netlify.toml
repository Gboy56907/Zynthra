[build]
  command = "npm run build"
  publish = "dist/client"
  # Skip functions - this is static-only
  target = "static"

[dev]
  command = "npm run dev"
  port = 3000
  targetPort = 5173

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[metadata]
  id = "nexacore-intelligence-hub"
  title = "Zynthra - AI Platform"